<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bücher</title>
<style>
  :root {
    --bg:        #f3eefa;
    --card:      #ffffff;
    --ink:       #2e1a47;
    --muted:     #7a6a94;
    --line:      #ddd0ee;
    --accent:    #7c3aed;
    --thumb-bg:  #ddd0ee;
  }

  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 24px; }
  .card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; }
  .card:hover { border-color: var(--accent); }
  .thumb { display: block; width: 100%; height: 170px; object-fit: cover; background: var(--thumb-bg); }
  .txt { padding: 16px 18px 12px; flex: 1; text-decoration: none; color: inherit; display: block; }
  .txt h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .txt p { margin: 0; color: var(--muted); }
  .txt:focus, .txt:hover { outline: none; }
  .links { display: flex; gap: 8px; padding: 0 18px 18px; }
  .btn { flex: 1; text-align: center; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; text-decoration: none; font-size: 0.95rem; }
  .btn:hover { filter: brightness(1.1); }
  .btn.alt { background: transparent; color: var(--accent); }
  .btn.alt:hover { background: var(--accent); color: #fff; filter: none; }
  .btn.off { opacity: 0.4; pointer-events: none; }
  /* make the text area behave like a clickable tile */
  .card .txt { cursor: pointer; }
</style>
</head>
<body>
<main id="app"></main>

<script>
  // Beschriftung der Buttons:
  // label1 / label2 = alle normalen Kacheln, label3 / label4 = nur die Test-Kachel
  const einstellungen = {
    label1: "Kaufseite",
    label2: "Buch Modus",
    label3: "N/A",
    label4: "N/A",
  };

  // Pro Eintrag: vorschau = kleines Vorschaubild, url1 / url2 = Seiten, die man unten auswählen kann
  // (url2 leer lassen = Button wird ausgegraut)
  // Die Test-Kachel verwendet stattdessen turl1 / turl2
  const bilder = [
    { titel: "Chemie", text: "Chemie",
      vorschau: "https://res.cloudinary.com/pim-red/image/upload/q_auto,f_auto,w_230/v1639480386/ccbuchner/titles/covers/c05508.jpg",
      url1: "https://www.ccbuchner.de/produkt/chemie-realschule-bayern-8-i-ausgabe-ab-2020-6014",
      url2: "https://www.ccbuchner.de/_files_media/livebook/6014/" },

    { titel: "Deutsch", text: "Deutschbuch",
      vorschau: "https://static.cornelsen.de/media/9783060673476/9783060673476_COVER_STD_B260_X2.png",
      url1: "https://www.cornelsen.de/produkte/deutschbuch-schulbuch-8-jahrgangsstufe-9783060673476",
      url2: "https://static.cornelsen.de/bgd/97/83/06/06/73/47/6/9783060673476_x1LIAB/index.html" },

    /*{ titel: "Englisch", text: "Red Line",
      vorschau: "https://assets.klett.de/assets/70982043/Cover_546079_2469_800.jpg",
      url1: "https://www.klett.de/produkt/isbn/978-3-12-546079-9",
      url2: "https://klettbib.livebook.de/978-3-12-546079-9/" },*/

    { titel: "Geographie", text: "Unsere Erde",
      vorschau: "https://static.cornelsen.de/media/9783637019065/9783637019065_COVER_STD_B260_X2.png",
      url1: "https://www.cornelsen.de/produkte/unsere-erde-oldenbourg-schulbuch-8-jahrgangsstufe-9783637019065",
      url2: "https://static.cornelsen.de/bgd/97/83/63/70/19/06/5/9783637019065_x1LIAB/index.html" },

    { titel: "Geschichte", text: "Horizonte",
      vorschau: "https://c.wgr.de/i/artikel/288x288-fit/978-3-14-112130-8.jpg",
      url1: "https://www.westermann.de/artikel/978-3-14-112130-8/Horizonte-Geschichte-Ausgabe-2018-fuer-Realschulen-in-Bayern-Schulbuch-8",
      url2: "https://blickinsbuch.westermann.de/978-3-14-112130-8/html5forwebkit.html?page=0&bbv=1&pcode=" },

    { titel: "Mathe", text: "Pytagoras",
      vorschau: "https://static.cornelsen.de/media/9783060401239/9783060401239_COVER_STD_B260_X2.png",
      url1: "https://www.cornelsen.de/produkte/pythagoras-schulbuch-8-jahrgangsstufe-wpf-i-9783060401239",
      url2: "https://static.cornelsen.de/bgd/97/83/06/04/01/23/9/9783060401239_x1LIAB/index.html" },

    { titel: "Physik", text: "Natur und Technik",
      vorschau: "https://static.cornelsen.de/media/9783060146734/9783060146734_COVER_STD_B260_X2.png",
      url1: "https://www.cornelsen.de/produkte/natur-und-technik-physik-neubearbeitung-schulbuch-band-8-wahlpflichtfaechergruppe-i-9783060146734",
      url2: "https://static.cornelsen.de/bgd/97/83/06/01/46/73/4/9783060146734_x1LIAB/index.html" },

    { titel: "Test", text: "N/A",
      vorschau: "https://static.cornelsen.de/media/9783060146734njn/hjh_COVER_STD_B260_X2.png",
      turl1: "https://www.cornelsen.de/produkte/natur-und-technikjnj-physik-neubearbeitung-vjijijschulbuch-band-8-wahlpflichtfaechergruppe-i-9783060146734",
      turl2: "https://static.cornelsen.de/bgd/97/83/06/hfjfi01/ifjf46/73/4/9783060146734jfjfj_x1LIAB/index.html" },
  ];

  // "Test" bleibt immer an erster Stelle, der Rest wird alphabetisch (nach Titel) sortiert
  const sortiert = bilder.slice().sort((a, b) => {
    if (a.titel === "Test") return -1;
    if (b.titel === "Test") return 1;
    return a.titel.localeCompare(b.titel, "de");
  });

  function button(url, label, extra) {
    return url
      ? `<a class="btn ${extra}" href="${url}" target="_blank" rel="noopener">${label}</a>`
      : `<span class="btn ${extra} off">${label}</span>`;
  }

  document.getElementById("app").innerHTML = `
    <h1>Bücher</h1>
    <p>Wähle unten bei der Kachel, welche URL du öffnen willst.</p>
    <div class="grid">` +
    sortiert.map(b => `
      <div class="card">
        <img class="thumb" src="${b.vorschau}" alt="${b.titel}" loading="lazy">
        ${b.titel === "Test"
          ? `<a class="txt" href="${b.turl1}" rel="noopener"><h2>${b.titel}</h2><p>${b.text}</p></a>`
          : `<a class="txt" href="${b.url1}" rel="noopener"><h2>${b.titel}</h2><p>${b.text}</p></a>`}
        <div class="links">
          ${b.titel === "Test"
            //Test
            ? button(b.turl1, einstellungen.label3, "") + button(b.turl2, einstellungen.label4, "alt")
            //Casual
            : button(b.url1, einstellungen.label1, "") + button(b.url2, einstellungen.label2, "alt")}
        </div>
      </div>`).join("") + `</div>`;
</script>
</body>
</html>
