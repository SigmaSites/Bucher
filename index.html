<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bücher</title>
<style>
  :root {
    --bg:        #f3eefa;
    --card:      #ffffff;
    --ink:       #2e1a47;
    --muted:     #7a6a94;
    --line:      #ddd0ee;
    --accent:    #7c3aed;
    --thumb-bg:  #ddd0ee;
  }

  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 24px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .thumb { display: block; width: 100%; height: 170px; object-fit: cover; background: var(--thumb-bg); }
  .txt { padding: 16px 18px 20px; }
  .txt h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .txt p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>

<script>
  // Pro Eintrag: vorschau = kleines Vorschaubild, url = Seite, die beim Klick aufgeht
  const bilder = [
    { titel: "Chemie", text: "Chemie",
      vorschau: "https://res.cloudinary.com/pim-red/image/upload/q_auto,f_auto,w_230/v1639480386/ccbuchner/titles/covers/c05508.jpg",
      url: "https://www.ccbuchner.de/produkt/chemie-realschule-bayern-8-i-ausgabe-ab-2020-6014" },
    
    { titel: "Deutsch", text: "Deutschbuch",
      vorschau: "https://static.cornelsen.de/media/9783060673476/9783060673476_COVER_STD_B260_X2.png",
      url: "https://www.cornelsen.de/produkte/deutschbuch-schulbuch-8-jahrgangsstufe-9783060673476" },
    
    { titel: "Englisch", text: "Red Line",
      vorschau: "https://assets.klett.de/assets/70982043/Cover_546079_2469_800.jpg",
      url: "https://www.klett.de/produkt/isbn/978-3-12-546079-9" },
    
    { titel: "Geographie", text: "Unsere Erde",
      vorschau: "https://static.cornelsen.de/media/9783637019065/9783637019065_COVER_STD_B260_X2.png",
      url: "https://www.cornelsen.de/produkte/unsere-erde-oldenbourg-schulbuch-8-jahrgangsstufe-9783637019065" },
    
    { titel: "Geschichte", text: "Horizonte",
      vorschau: "https://c.wgr.de/i/artikel/288x288-fit/978-3-14-112130-8.jpg",
      url: "https://www.westermann.de/artikel/978-3-14-112130-8/Horizonte-Geschichte-Ausgabe-2018-fuer-Realschulen-in-Bayern-Schulbuch-8" },
    
    { titel: "Mathe", text: "Pytagoras",
      vorschau: "https://static.cornelsen.de/media/9783060401239/9783060401239_COVER_STD_B260_X2.png",
      url: "https://www.cornelsen.de/produkte/pythagoras-schulbuch-8-jahrgangsstufe-wpf-i-9783060401239" },
    
    { titel: "Physik", text: "Natur und Technik",
      vorschau: "https://static.cornelsen.de/media/9783060146734/9783060146734_COVER_STD_B260_X2.png",
      url: "https://www.cornelsen.de/produkte/natur-und-technik-physik-neubearbeitung-schulbuch-band-8-wahlpflichtfaechergruppe-i-9783060146734" },
  ];

  document.getElementById("app").innerHTML = `
    <h1>Bilder</h1>
    <p>Klick auf ein Bild, um zum Buch zu kommen.</p>
    <div class="grid">` +
    bilder.map(b => `
      <a class="card" href="${b.url}" target="_blank" rel="noopener">
        <img class="thumb" src="${b.vorschau}" alt="${b.titel}" loading="lazy">
        <div class="txt"><h2>${b.titel}</h2><p>${b.text}</p></div>
      </a>`).join("") + `</div>`;
</script>
</body>
</html>
